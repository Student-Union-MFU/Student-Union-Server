services:
  # Cloudflare terminates TLS at its edge and reaches us through an OUTBOUND
  # connection this container opens — no inbound ports, no NAT rules, which is
  # the whole reason we need it: the server sits on a private address behind
  # campus NAT where Let's Encrypt could never reach us.
  #
  # QUICK TUNNEL mode: no account, no domain, no token. Cloudflare assigns a
  # random *.trycloudflare.com hostname with a real cert. Read it out of the
  # logs — it is printed nowhere else:
  #   docker compose logs cloudflared | grep trycloudflare
  #
  # The URL CHANGES on every restart. That is the tradeoff for needing no
  # domain, and it is why this cannot back Google OAuth: the redirect URI has
  # to be a fixed URL registered in Google Cloud Console.
  #
  # Once a domain exists, switch to the named tunnel below.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8080
    depends_on:
      - backend

  # NAMED TUNNEL — stable hostname, needs a domain on Cloudflare. To switch:
  # comment out the quick-tunnel service above, uncomment this, and put the
  # connector token in .env. Route the hostname to http://backend:8080 in the
  # Cloudflare dashboard (NOT localhost:8080 — that resolves to the cloudflared
  # container itself and 502s).
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     # Deliberately not ${TUNNEL_TOKEN:?...}: the :? form aborts every compose
  #     # command when unset, including `down`, which locks you out of stopping
  #     # the stack. cloudflared reports a missing token clearly enough on its own.
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
  #   depends_on:
  #     - backend

  # Only used for LAN-only serving without the tunnel. Not started by default;
  # run it with `docker compose --profile lan up -d`. Leaving it on would bind
  # 80/443 for nothing, since the tunnel makes a reverse proxy redundant here.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    profiles: ["lan"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    container_name: su-server
    # Bound to loopback so the backend is only reachable through Caddy, never
    # directly. A bare "8080:8080" publishes it unencrypted on every interface.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # ทับค่าจาก .env เฉพาะตอนรันใน compose
      # ใน container คำว่า localhost = ตัว container เอง ไม่ใช่เครื่องเรา
      # ต้องเรียก DB ด้วยชื่อ service ("database") ผ่าน network ของ compose
      # .env ยังเป็น localhost ไว้ให้ `make dev` (go run บนเครื่อง) ใช้ได้เหมือนเดิม
      - DB_HOST=database
    depends_on:
      database: 
        condition: service_healthy
    develop:
      watch:
        - path: .
          target: /app
          action: rebuild

  database:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=yion
      - POSTGRES_DB=sudb
    # Bound to 127.0.0.1 so `make dev` / `make migrate-up` still reach it from
    # the host, but it is NOT reachable from the internet. A bare "5432:5432"
    # would publish Postgres on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sudb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: fullstack-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
