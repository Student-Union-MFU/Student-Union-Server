services:
  # Cloudflare terminates TLS at its edge and reaches us through an OUTBOUND
  # connection this container opens — no inbound ports, no NAT rules, which is
  # the whole reason we need it: the server sits on a private address behind
  # campus NAT where Let's Encrypt could never reach us.
  #
  # NAMED TUNNEL — stable hostname api.studentunion.social. Put the connector
  # token in .env as TUNNEL_TOKEN, then map the hostname to http://backend:8080
  # in the Cloudflare dashboard (Zero Trust > Networks > Tunnels > Public
  # Hostname). Use http://backend:8080, NOT localhost:8080 — localhost inside
  # the container resolves to cloudflared itself and 502s.
  #
  # Because the hostname is fixed it can back Google OAuth: register
  # https://api.studentunion.social/... as the redirect URI in Google Cloud
  # Console.
  #
  # PRODUCTION ONLY — gated behind the "prod" compose profile.
  #
  # A dev box has no business opening a public tunnel. Every `docker compose up`
  # on a laptop was publishing that laptop's backend at
  # api.studentunion.social, so whoever booted last silently took over the live
  # hostname and served their half-migrated database to the real apps. The
  # failure is invisible from the machine causing it: locally everything works.
  #
  #   docker compose up -d                  # dev — database, migrate, backend
  #   docker compose --profile prod up -d   # production — plus the tunnel
  #
  # A service with a profile is skipped unless that profile is named, so the
  # default is now the safe one. `docker compose down` still removes this
  # container without the flag: down works on the whole project, not on the
  # active profile set.
  cloudflared:
    profiles: ["prod"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Deliberately not ${TUNNEL_TOKEN:?...}: the :? form aborts every compose
      # command when unset, including `down`, which locks you out of stopping
      # the stack. cloudflared reports a missing token clearly enough on its own.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - backend

  # One-shot: applies db/migrations against the DB, then exits. Runs the same
  # golang-migrate files as `make migrate-up`, so schema_migrations stays in
  # sync whether you migrate by hand or via compose. Reaches Postgres by its
  # compose service name ("database") over the shared network. On a fully
  # migrated DB it prints "no change" and exits 0, so it is safe every boot.
  #
  # If it exits with "Dirty database version N", a previous run of migration N
  # aborted partway. golang-migrate then refuses every later run — including the
  # one that would fix it — and because the backend waits on this service, the
  # whole stack stops coming up. Check what the schema actually contains, stamp
  # the version back to the last one that really applied, then re-run:
  #   docker compose run --rm migrate -path=/migrations \
  #     -database "postgres://admin:yion@database:5432/sudb?sslmode=disable" force <N-1>
  migrate:
    image: migrate/migrate:latest
    container_name: su-migrate
    restart: "no"
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database
      # Same defaults as the `database` service below, and they have to stay the
      # same three. Bare ${DB_USER} collapses to an empty string when unset, so a
      # missing .env built `postgres://:@database:5432/?sslmode=disable` and
      # migrate failed against a database that had meanwhile come up perfectly
      # well under the defaults — the two halves disagreeing about who to be.
      - postgres://${DB_USER:-admin}:${DB_PASS:-yion}@database:5432/${DB_NAME:-sudb}?sslmode=disable
      - up
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: .
    container_name: su-server
    # Without this the backend is the only long-lived service that does NOT come
    # back after a host or docker-daemon restart — database (always) and
    # cloudflared (unless-stopped) do. That asymmetry took the API down for 28h
    # on 2026-07-27: the tunnel stayed up and served 502 with nothing crashed.
    # "unless-stopped" and not "always" so an explicit `docker stop` still sticks.
    restart: unless-stopped
    # Bound to loopback so the backend is only reachable through the tunnel or
    # from the host, never directly on a public interface. A bare "8080:8080"
    # publishes it unencrypted on every interface.
    ports:
      - "127.0.0.1:8080:8080"
    # Resolvers the container can actually reach.
    #
    # Without this the backend inherits the host's /etc/resolv.conf, whose first
    # entry is a LAN/VPN resolver that does not answer for the docker bridge.
    # Docker's embedded resolver forwards to it and waits, so every outbound
    # hostname lookup times out — which broke Google sign-in and nothing else,
    # because verifying an ID token is the only thing this server resolves by
    # name. It failed as "context canceled" after 15s, the app's read timeout,
    # which reads like a Google problem and is a DNS one.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    volumes:
      # service account ของ Firebase — mount ทั้ง "โฟลเดอร์" ไม่ใช่ไฟล์เดี่ยว เพราะถ้า
      # bind ไฟล์ที่ยังไม่มีอยู่ docker จะสร้างโฟลเดอร์ชื่อนั้นขึ้นมาแทน แล้วอ่านไม่ได้
      # ตลอดไปโดยที่ error ไม่ชี้ว่าเป็นเพราะอะไร · mount โฟลเดอร์เปล่าไม่มีผลอะไรเลย
      # เครื่องที่ยังไม่มีไฟล์จึงรันได้ปกติ push แค่ปิดเงียบเหมือนเดิม
      - ./secrets:/run/secrets:ro
    environment:
      # ทับค่าจาก .env เฉพาะตอนรันใน compose
      # ใน container คำว่า localhost = ตัว container เอง ไม่ใช่เครื่องเรา
      # ต้องเรียก DB ด้วยชื่อ service ("database") ผ่าน network ของ compose
      # .env ยังเป็น localhost ไว้ให้ `make dev` (go run บนเครื่อง) ใช้ได้เหมือนเดิม
      - DB_HOST=database
    depends_on:
      database:
        condition: service_healthy
      # Wait for migrations to finish (exit 0) before the backend starts, so it
      # never boots against a half-built schema.
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: .
          target: /app
          action: rebuild

  database:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    # Load pg_stat_statements, which is what makes the server stats page able to
    # answer "which query is costing us" — see migration 000027 and
    # docs/stats-dashboard.md.
    #
    # ⚠ shared_preload_libraries is a POSTMASTER-level setting. It is read once
    # when Postgres starts and a reload does not pick it up, so this line only
    # takes effect after the container is recreated:
    #
    #     docker compose up -d --force-recreate database
    #
    # ⚠ The extension is the other half, and its absence is silent. Without
    # `CREATE EXTENSION pg_stat_statements` (migration 000027) the library sits
    # here collecting statistics that nothing has a view to read. Without THIS
    # line, the migration succeeds and every query against the view fails at run
    # time with SQLSTATE 55000. Both halves or neither.
    #
    # track=all counts statements nested inside functions and DO blocks too, not
    # only the ones the server sends directly.
    #
    # This replaces the image's default command, which is a bare `postgres` —
    # the entrypoint still runs first, so initdb, POSTGRES_PASSWORD and the rest
    # behave exactly as before.
    #
    # The cost is a couple of megabytes of shared memory for 5,000 tracked
    # statements. That matters on this box, which runs the Go server and
    # Postgres together at around 69% memory, and it is the reason
    # docs/stats-dashboard.md picks this over a Prometheus and Grafana pair.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    # Read from .env, exactly like `migrate` and `backend` do.
    #
    # These were three hardcoded literals while the other two services took the
    # same three values from ${DB_USER}/${DB_PASS}/${DB_NAME}. Whenever a .env
    # disagreed, the database came up owned by `admin` and `migrate` then tried
    # to sign in as whoever .env named — so migrate exited non-zero, and because
    # `backend` waits on `service_completed_successfully`, nothing started at
    # all. The failure names a role that does not exist, which reads like a
    # Postgres problem rather than a compose one.
    #
    # Defaults, not the `${DB_USER:?}` form: `:?` aborts *every* compose command
    # when the variable is unset, `down` included, which locks you out of
    # stopping the stack — the same reason TUNNEL_TOKEN above avoids it. The
    # defaults are the literals this file used before, so a machine with no .env
    # behaves exactly as it always did.
    #
    # ⚠ POSTGRES_* are read ONLY when the data directory is first created. On a
    # volume that already exists these are ignored, and the credentials baked in
    # at init are the real ones forever. Changing DB_USER/DB_PASS in .env against
    # a live `pgdata` therefore does NOT rename anything — it just points every
    # client at a role the database has never heard of. Either keep .env matching
    # what the volume was built with, or create the role by hand.
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASS:-yion}
      - POSTGRES_DB=${DB_NAME:-sudb}
    # Bound to 127.0.0.1 so `make dev` / `make migrate-up` still reach it from
    # the host, but it is NOT reachable from the internet. A bare "5432:5432"
    # would publish Postgres on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Same two values again — a healthcheck hardcoding `admin`/`sudb` against a
    # database created as something else never turns healthy, and both dependent
    # services wait on `service_healthy`, so the stack hangs with no error.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-sudb}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: fullstack-network

volumes:
  pgdata:
