services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    container_name: su-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # ทับค่าจาก .env เฉพาะตอนรันใน compose
      # ใน container คำว่า localhost = ตัว container เอง ไม่ใช่เครื่องเรา
      # ต้องเรียก DB ด้วยชื่อ service ("database") ผ่าน network ของ compose
      # .env ยังเป็น localhost ไว้ให้ `make dev` (go run บนเครื่อง) ใช้ได้เหมือนเดิม
      - DB_HOST=database
    depends_on:
      database: 
        condition: service_healthy
    develop:
      watch:
        - path: .
          target: /app
          action: rebuild

  database:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=yion
      - POSTGRES_DB=sudb
    # Bound to 127.0.0.1 so `make dev` / `make migrate-up` still reach it from
    # the host, but it is NOT reachable from the internet. A bare "5432:5432"
    # would publish Postgres on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sudb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: fullstack-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
