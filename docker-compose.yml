services:
  # Cloudflare terminates TLS at its edge and reaches us through an OUTBOUND
  # connection this container opens — no inbound ports, no NAT rules, which is
  # the whole reason we need it: the server sits on a private address behind
  # campus NAT where Let's Encrypt could never reach us.
  #
  # NAMED TUNNEL — stable hostname api.studentunion.social. Put the connector
  # token in .env as TUNNEL_TOKEN, then map the hostname to http://backend:8080
  # in the Cloudflare dashboard (Zero Trust > Networks > Tunnels > Public
  # Hostname). Use http://backend:8080, NOT localhost:8080 — localhost inside
  # the container resolves to cloudflared itself and 502s.
  #
  # Because the hostname is fixed it can back Google OAuth: register
  # https://api.studentunion.social/... as the redirect URI in Google Cloud
  # Console.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Deliberately not ${TUNNEL_TOKEN:?...}: the :? form aborts every compose
      # command when unset, including `down`, which locks you out of stopping
      # the stack. cloudflared reports a missing token clearly enough on its own.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - backend

  # One-shot: applies db/migrations against the DB, then exits. Runs the same
  # golang-migrate files as `make migrate-up`, so schema_migrations stays in
  # sync whether you migrate by hand or via compose. Reaches Postgres by its
  # compose service name ("database") over the shared network. On a fully
  # migrated DB it prints "no change" and exits 0, so it is safe every boot.
  #
  # If it exits with "Dirty database version N", a previous run of migration N
  # aborted partway. golang-migrate then refuses every later run — including the
  # one that would fix it — and because the backend waits on this service, the
  # whole stack stops coming up. Check what the schema actually contains, stamp
  # the version back to the last one that really applied, then re-run:
  #   docker compose run --rm migrate -path=/migrations \
  #     -database "postgres://admin:yion@database:5432/sudb?sslmode=disable" force <N-1>
  migrate:
    image: migrate/migrate:latest
    container_name: su-migrate
    restart: "no"
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database
      - postgres://${DB_USER}:${DB_PASS}@database:5432/${DB_NAME}?sslmode=disable
      - up
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: .
    container_name: su-server
    # Without this the backend is the only long-lived service that does NOT come
    # back after a host or docker-daemon restart — database (always) and
    # cloudflared (unless-stopped) do. That asymmetry took the API down for 28h
    # on 2026-07-27: the tunnel stayed up and served 502 with nothing crashed.
    # "unless-stopped" and not "always" so an explicit `docker stop` still sticks.
    restart: unless-stopped
    # Bound to loopback so the backend is only reachable through the tunnel or
    # from the host, never directly on a public interface. A bare "8080:8080"
    # publishes it unencrypted on every interface.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # ทับค่าจาก .env เฉพาะตอนรันใน compose
      # ใน container คำว่า localhost = ตัว container เอง ไม่ใช่เครื่องเรา
      # ต้องเรียก DB ด้วยชื่อ service ("database") ผ่าน network ของ compose
      # .env ยังเป็น localhost ไว้ให้ `make dev` (go run บนเครื่อง) ใช้ได้เหมือนเดิม
      - DB_HOST=database
    depends_on:
      database:
        condition: service_healthy
      # Wait for migrations to finish (exit 0) before the backend starts, so it
      # never boots against a half-built schema.
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - path: .
          target: /app
          action: rebuild

  database:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=yion
      - POSTGRES_DB=sudb
    # Bound to 127.0.0.1 so `make dev` / `make migrate-up` still reach it from
    # the host, but it is NOT reachable from the internet. A bare "5432:5432"
    # would publish Postgres on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sudb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: fullstack-network

volumes:
  pgdata:
